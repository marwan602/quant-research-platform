[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Survivorship-bias-free S&P 500 quantitative research and trading platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "yfinance>=0.2.36",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
